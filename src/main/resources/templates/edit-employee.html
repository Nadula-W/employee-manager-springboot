
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container narrow">

    <header>
        <h1>Edit Employee</h1>
        <p>Update employee information</p>
    </header>

    <section class="card">
        <h2>Employee Details</h2>

        <form th:action="@{/employees/{id}/update(id=${employee.id})}"
              th:object="${employee}"
              method="post" novalidate>

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}">
                <small class="error"
                       th:if="${#fields.hasErrors('fullName')}"
                       th:errors="*{fullName}"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}">
                <small class="error"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></small>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}">
                <small class="error"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"></small>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" th:field="*{department}">
                <small class="error"
                       th:if="${#fields.hasErrors('department')}"
                       th:errors="*{department}"></small>
            </div>

            <div class="form-group">
                <label>Salary</label>
                <input type="number" step="0.01"
                       th:field="*{salary}">
                <small class="error"
                       th:if="${#fields.hasErrors('salary')}"
                       th:errors="*{salary}"></small>
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">
                    Update Employee
                </button>

                <a th:href="@{/employees}" class="btn secondary">
                    Cancel
                </a>
            </div>

        </form>
    </section>
</div>

</body>
</html>
