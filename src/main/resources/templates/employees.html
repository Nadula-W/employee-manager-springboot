
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>Employee Management System</h1>
        <p>Manage employee records using Spring Boot and MySQL</p>
    </header>

    <div class="alert success" th:if="${success}"
         th:text="${success}"></div>

    <!-- Employee Registration Form -->
    <section class="card">
        <h2>Add New Employee</h2>

        <form th:action="@{/employees}"
              th:object="${employee}"
              method="post" novalidate>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}"
                           placeholder="Enter full name">
                    <small class="error"
                           th:if="${#fields.hasErrors('fullName')}"
                           th:errors="*{fullName}"></small>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}"
                           placeholder="Enter email address">
                    <small class="error"
                           th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" th:field="*{phone}"
                           placeholder="07XXXXXXXX">
                    <small class="error"
                           th:if="${#fields.hasErrors('phone')}"
                           th:errors="*{phone}"></small>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" th:field="*{department}"
                           placeholder="Enter department">
                    <small class="error"
                           th:if="${#fields.hasErrors('department')}"
                           th:errors="*{department}"></small>
                </div>

                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" step="0.01"
                           th:field="*{salary}"
                           placeholder="Enter salary">
                    <small class="error"
                           th:if="${#fields.hasErrors('salary')}"
                           th:errors="*{salary}"></small>
                </div>

            </div>

            <button type="submit" class="btn primary">
                Save Employee
            </button>
        </form>
    </section>

    <!-- Employee Records Table -->
    <section class="card">
        <div class="table-heading">
            <h2>Employee Records</h2>
            <span class="counter"
                  th:text="|Total: ${#lists.size(employees)}|">
                Total: 0
            </span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>

                    <td>
                        <div class="actions">
                            <a class="btn edit"
                               th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                Edit
                            </a>

                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this employee?')">

                                <button type="submit" class="btn delete">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="empty">
                        No employees registered yet.
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </section>
</div>

</body>
</html>
